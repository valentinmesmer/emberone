name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  copyright-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - run: python3 support/scripts/add-copyright-headers.py --check

  commit-messages:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Test commit message checker
        run: python3 -m unittest support/scripts/test_check_conventional_commit.py -v
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: python3 support/scripts/check-conventional-commit.py --from "$BASE_SHA"
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 support/scripts/check-conventional-commit.py --message "$PR_TITLE"

  backend-test:
    needs: changes
    if: >-
      needs.changes.outputs.backend == 'true' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Test
        working-directory: backend
        run: ./gradlew build printJacocoCoverage --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/build/reports/jacoco/test/
            backend/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 7

  frontend-test:
    needs: changes
    if: >-
      needs.changes.outputs.frontend == 'true' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json
      - name: Lint and build
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build

  release:
    needs:
      [changes, copyright-headers, commit-messages, backend-test, frontend-test]
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main') &&
      needs.changes.result == 'success' &&
      needs['copyright-headers'].result == 'success' &&
      needs['commit-messages'].result == 'success' &&
      (needs['backend-test'].result == 'success' || needs['backend-test'].result == 'skipped') &&
      (needs['frontend-test'].result == 'success' || needs['frontend-test'].result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.release-meta.outputs.published }}
      version: ${{ steps.release-meta.outputs.version }}
      major: ${{ steps.release-meta.outputs.major }}
      minor: ${{ steps.release-meta.outputs.minor }}
      tag: ${{ steps.release-meta.outputs.tag }}
      head: ${{ steps.release-meta.outputs.head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Semantic Release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@ad51787758d9654d5a75150a89a6fa9b3ccef95e # v8.1.4
        with:
          semantic_version: 25.0.9
          skip_npm_plugin: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Export release metadata
        id: release-meta
        env:
          SR_PUBLISHED: ${{ steps.semantic-release.outputs.new_release_published }}
          SR_VERSION: ${{ steps.semantic-release.outputs.new_release_version }}
          SR_MAJOR: ${{ steps.semantic-release.outputs.new_release_major_version }}
          SR_MINOR: ${{ steps.semantic-release.outputs.new_release_minor_version }}
          SR_TAG: ${{ steps.semantic-release.outputs.new_release_git_tag }}
          SR_HEAD: ${{ steps.semantic-release.outputs.new_release_git_head }}
        run: |
          echo "published=$SR_PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "version=$SR_VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$SR_MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$SR_MINOR" >> "$GITHUB_OUTPUT"
          echo "tag=$SR_TAG" >> "$GITHUB_OUTPUT"
          echo "head=$SR_HEAD" >> "$GITHUB_OUTPUT"

  release-image:
    needs: release
    if: >-
      needs.release.result == 'success' &&
      needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}
          fetch-depth: 0
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/development' }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }},enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ needs.release.outputs.major }},enable=${{ github.ref == 'refs/heads/main' && needs.release.outputs.major != '0' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.revision=${{ needs.release.outputs.head }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.tag }}
      - name: Verify image tags
        run: |
          if [ -z "${{ steps.meta.outputs.tags }}" ]; then
            echo "No Docker tags generated for ${{ matrix.component }}"
            exit 1
          fi
          echo "${{ steps.meta.outputs.tags }}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.component }}/docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
            GIT_TAG=${{ needs.release.outputs.tag }}
            SOURCE_REVISION=${{ needs.release.outputs.head }}
            SOURCE_REPO=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

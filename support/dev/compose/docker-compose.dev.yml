name: emberone-dev

x-default-env: &default-env
  TZ: ${TZ:-UTC}

services:
  postgres:
    image: postgres:18-alpine
    container_name: emberone-postgres
    environment:
      <<: *default-env
      POSTGRES_USER: ${EMBERONE_POSTGRES_USER:-emberone}
      POSTGRES_PASSWORD: ${EMBERONE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${EMBERONE_POSTGRES_DB:-emberone}
    ports:
      - "${EMBERONE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${EMBERONE_POSTGRES_USER:-emberone} -d ${EMBERONE_POSTGRES_DB:-emberone}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: emberone-seaweedfs
    command: "server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip=seaweedfs"
    environment:
      <<: *default-env
    ports:
      - "${EMBERONE_S3_PORT:-8333}:8333"
      - "${EMBERONE_SEAWEED_MASTER_PORT:-9333}:9333"
    volumes:
      - seaweedfs_data:/data
      - ../config/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://127.0.0.1:9333/cluster/status" ]
      interval: 30s
      timeout: 20s
      retries: 3

  authentik-redis:
    image: redis:8-alpine
    container_name: emberone-authentik-redis
    environment:
      <<: *default-env
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: emberone-redis
    restart: unless-stopped
    environment:
      <<: *default-env
      REDIS_PASSWORD: ${EMBERONE_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - redis-server --requirepass "$$REDIS_PASSWORD"
    ports:
      - "${EMBERONE_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  redisinsight:
    image: redis/redisinsight:3.8
    container_name: emberone-redisinsight
    environment:
      <<: *default-env
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
    ports:
      - "${EMBERONE_REDIS_COMMANDER_PORT:-8081}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.32.0
    container_name: emberone-mailpit
    environment:
      <<: *default-env
    ports:
      - "${EMBERONE_MAIL_SMTP_PORT:-1025}:1025"
      - "${EMBERONE_MAIL_UI_PORT:-8025}:8025"

  authentik-postgresql:
    image: postgres:18-alpine
    container_name: emberone-authentik-postgres
    environment:
      <<: *default-env
      POSTGRES_USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AUTHENTIK_POSTGRES_DB:-authentik}
    volumes:
      - authentik_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRES_USER:-authentik} -d ${AUTHENTIK_POSTGRES_DB:-authentik}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  authentik-server:
    image: authentik/server:2026.8.5
    container_name: emberone-authentik-server
    command: server
    environment:
      <<: *default-env
      AUTHENTIK_HOST: ${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_REDIS__HOST: authentik-redis
    ports:
      - "${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ../authentik-blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

  authentik-worker:
    image: authentik/server:2026.8.5
    container_name: emberone-authentik-worker
    command: worker
    environment:
      <<: *default-env
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_API_TOKEN}
      AUTHENTIK_HOST: ${AUTHENTIK_PUBLIC_URL:-http://localhost:9000}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRES_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRES_DB:-authentik}
      AUTHENTIK_REDIS__HOST: authentik-redis
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates
      - ../authentik-blueprints:/blueprints/custom:ro
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy

volumes:
  postgres_data:
  seaweedfs_data:
  authentik_postgres_data:
  authentik_media:
  authentik_templates:
  redisinsight_data:

version: 1
metadata:
  name: emberone-applications
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: provider-emberone
    identifiers:
      name: EmberOne
    attrs:
      name: EmberOne
      client_type: public
      grant_types:
        - authorization_code
        - refresh_token
      client_id: 'emberone'
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      redirect_uris:
        - matching_mode: strict
          url: http://localhost:3000/auth/callback
          redirect_uri_type: authorization
        - matching_mode: regex
          url: http://localhost:3000/.*
          redirect_uri_type: authorization
        - matching_mode: strict
          url: http://localhost:3000
          redirect_uri_type: logout
        - matching_mode: strict
          url: http://localhost:3000/
          redirect_uri_type: logout
      logout_uri: http://localhost:3000
      logout_method: frontchannel
      access_code_validity: minutes=1
      access_token_validity: hours=1
      refresh_token_validity: days=30
      include_claims_in_id_token: true
      issuer_mode: per_provider
      sub_mode: user_username
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [name, "EmberOne user scope (userId, tenantId, app_role)"]]

  - model: authentik_core.application
    id: app-emberone
    identifiers:
      slug: emberone
    attrs:
      name: EmberOne
      slug: emberone
      group: EMBERONE
      meta_launch_url: http://localhost:3000
      policy_engine_mode: any
      provider: !KeyOf provider-emberone

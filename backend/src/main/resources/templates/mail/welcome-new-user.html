<html xmlns:th="http://www.thymeleaf.org" lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title th:text="${pageTitle}">Welcome</title>
</head>
<body style="margin:0;padding:0;background-color:#eceae5;font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#eceae5;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#fdfcfa;border-radius:16px;overflow:hidden;border:1px solid #d8d4cc;">
          <tr th:replace="~{_brand-header :: brandHeader}"></tr>
          <tr>
            <td style="padding:28px 24px 8px 24px;">
              <h1 style="margin:0 0 14px 0;font-family:'Sora',Arial,sans-serif;font-size:22px;font-weight:700;color:#1a1a1a;line-height:1.25;" th:text="${heading}">
                Welcome
              </h1>
              <p style="margin:0 0 22px 0;font-size:15px;line-height:1.55;color:#8a8580;" th:text="${intro}">
                Intro
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px 24px;">
              <p style="margin:0 0 6px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#8a8580;" th:text="${usernameLabel}">Username</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f2ee;border:1px solid #d8d4cc;border-radius:8px;">
                <tr>
                  <td style="padding:12px 14px;font-size:15px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;font-weight:500;color:#1a1a1a;word-break:break-all;-webkit-user-select:all;-moz-user-select:all;user-select:all;" th:text="${username}">user.name</td>
                </tr>
              </table>
              <p style="margin:18px 0 6px 0;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:#8a8580;" th:text="${temporaryPasswordLabel}">Password</p>
              <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f2ee;border:1px solid #c1272d;border-radius:8px;">
                <tr>
                  <td style="padding:12px 14px;font-size:15px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono',monospace;font-weight:500;color:#1a1a1a;letter-spacing:0.04em;-webkit-user-select:all;-moz-user-select:all;user-select:all;" th:text="${temporaryPassword}">password</td>
                </tr>
              </table>
              <p style="margin:14px 0 0 0;font-size:13px;line-height:1.5;color:#8a8580;" th:text="${passwordHint}">
                Password hint
              </p>
            </td>
          </tr>
          <tr th:if="${hasLoginUrl}">
            <td style="padding:0 24px 28px 24px;" align="center">
              <a th:href="${loginUrl}"
                 style="display:inline-block;background-color:#c1272d;color:#ffffff !important;text-decoration:none;font-weight:600;font-size:15px;padding:12px 28px;border-radius:8px;"
                 th:text="${loginButton}">
                Login
              </a>
              <p style="margin:18px 0 0 0;font-size:12px;line-height:1.45;color:#8a8580;word-break:break-all;">
                <span th:text="${loginUrlHint}">URL hint</span><br/>
                <a th:href="${loginUrl}" th:text="${loginUrl}" style="color:#c1272d;text-decoration:underline;">https://…</a>
              </p>
            </td>
          </tr>
          <tr th:unless="${hasLoginUrl}">
            <td style="padding:0 24px 28px 24px;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#8a8580;" th:text="${noLoginUrlHint}">
                No login URL hint
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 24px 22px 24px;border-top:1px solid #d8d4cc;">
              <p style="margin:0;font-size:12px;line-height:1.5;color:#8a8580;text-align:center;" th:text="${footer}">
                Footer
              </p>
              <p style="margin:10px 0 0 0;font-size:11px;color:#8a8580;text-align:center;" th:text="${copyright}">© EmberOne</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
